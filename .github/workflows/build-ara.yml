name: Build Ara Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore Android project structure
        run: |
          unzip -o "AraAndroid_starter(1).zip" -d .
          mkdir -p app/src/main/java/com/lola/ara
          cp MainActivity.kt app/src/main/java/com/lola/ara/MainActivity.kt
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          sed -i '/dependencies {/a\    implementation("io.coil-kt:coil-compose:2.7.0")' app/build.gradle.kts
          echo '--- app gradle ---'
          cat app/build.gradle.kts
          echo '--- imports ---'
          sed -n '1,45p' app/src/main/java/com/lola/ara/MainActivity.kt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ara-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

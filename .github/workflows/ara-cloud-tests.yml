name: Ara cloud foundation tests

on:
  push:
    branches:
      - ara/cloud-autonomy-foundation
      - ara/supervised-memory-stop
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run cloud foundation tests
        run: node --test test/*.test.mjs

name: Ara cloud foundation tests

on:
  push:
    branches:
      - ara/cloud-autonomy-foundation
      - ara/supervised-memory-stop
      - ara/free-neon-memory
      - ara/owner-scoped-memory-api
      - ara/android-memory-sync-controls
  pull_request:
    branches:
      - main
      - ara/cloud-autonomy-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts
      - name: Run cloud foundation tests
        run: node --test test/*.test.mjs
